name: Weekly refresh

# Odd minute on purpose: GitHub's scheduler runs late and drops on-the-hour jobs.
# Weekly rather than daily because the download figure is a rolling 30-day window, so
# day-to-day movement is noise - and each run appends to data/history.csv, which is what
# eventually makes the seasonality visible.
on:
  schedule:
    - cron: "23 20 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Fetch the corpus
        run: python tools/fetch.py

      - name: Compute
        run: python tools/compute.py

      - name: Build
        run: python tools/build.py

      # The suite is the gate, not a formality: it has caught an inverted axis and a
      # chart with the oldest work missing. A failing run must not publish.
      - name: Test
        run: python tests/smoke.py

      - name: Commit if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
          git push
